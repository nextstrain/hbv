# This configuration file should contain all required configuration parameters
# for the ingest workflow to run to completion.

#__________________________________________________________________________________________________________ REFERENCE / DATASET __________________________________________________________________________________________________________

# Used to re-circularise genomes. This should be the same as the reference in the nextclade dataset!
# Also force-included for a number of datasets
reference_accession: "NC_003977"
reference_genbank: "defaults/NC_003977.gb"

# Path to the nextclade dataset, which will be used to align all sequences
nextclade_dataset: "../nextclade_datasets/references/NC_003977/versions/2023-08-22"

# technically CDSs, but we use these terms rather interchangeably.
# These should be the entire list of CDSs in the nextclade dataset's genemap
genes: ['envS', 'envM', 'envL', 'X', 'pre-capsid', 'capsid', 'pol']

#__________________________________________________________________________________________________________ FETCH SETTINGS __________________________________________________________________________________________________________

# Entrez query used for the GenBank branch.
entrez_query: 'Hepatitis B virus[Organism]'   # For all genomes
# Restrict the Entrez branch to records annotated as complete genomes.
# Development mode enables this automatically regardless of the setting here.
# When enabled outside development mode, the active NCBI NDJSON is also subset
# to the fetched Entrez accession set.
entrez_complete_genomes_only: false

# NCBI taxon used for the Datasets package download.
ncbi_taxon_id: 3431302

#__________________________________________________________________________________________________________ NCBI DATASETS FIELDS __________________________________________________________________________________________________________

# Fields requested from the NCBI Datasets report before curate field remapping.
ncbi_datasets_fields:
  - accession
  - isolate-lineage
  - geo-region
  - geo-location
  - isolate-collection-date
  - release-date
  - update-date
  - length
  - host-name
  - is-lab-host
  - isolate-lineage-source
  - submitter-names
  - submitter-affiliation
  - submitter-country
  - virus-name
  - virus-tax-id

#__________________________________________________________________________________________________________ DEVELOPMENT MODE __________________________________________________________________________________________________________

# Enable helper-script logging during ingest runs.
verbose: true

# Development mode:
# - curate always reads `data/active/ncbi_records.ndjson`
# - when `dev: true`, ingest first fetches the first `dev_n_ingest` Entrez
#   GenBank records from the query result
# - development-mode Entrez fetching always restricts to `complete genome`
#   records, regardless of `entrez_complete_genomes_only`
# - the parsed accessions from that Entrez sample are written to
#   `data/active/active_entrez_accessions.txt`
# - the active NCBI NDJSON is then filtered to those accessions so the NCBI and
#   Entrez branches use the same development cohort
# - when `dev: false`, the active NDJSON is still subset if
#   `entrez_complete_genomes_only: true`; otherwise it is copied directly from
#   the full raw NCBI NDJSON and Entrez runs on the full query
dev: false
dev_n_ingest: 100

#__________________________________________________________________________________________________________ CURATE PIPELINE __________________________________________________________________________________________________________

# Config parameters related to the curate pipeline
curate:
  # The path to the local geolocation rules for this pathogen.
  # The path should be relative to the working directory (e.g. --directory).
  # If the path doesn't exist in the working directory, the file in the workflow's defaults/ directory it used instead (if it exists).
  local_geolocation_rules: "geolocation_rules.tsv"
  # List of field names to change where the key is the original field name and the value is the new field name
  # The original field names should match the ncbi_datasets_fields provided above.
  # This is the first step in the pipeline, so any references to field names in the configs below should use the new field names
  field_map:
    accession: accession
    accession_version: accession_version
    isolate-lineage: isolate
    geo-region: region
    geo-location: location
    isolate-collection-date: date
    release-date: date_released
    update-date: date_updated
    length: length
    host-name: host
    is-lab-host: is_lab_host
    isolate-lineage-source: sample_type
    submitter-names: full_authors
    submitter-affiliation: institution
    submitter-country: submitter_country
    virus-name: genotype
    virus-tax-id: taxon_id
  # Standardized strain name regex
  # Currently accepts any characters because we do not have a clear standard for strain names across pathogens
  strain_regex: "^.+$"
  # Back up strain name field to use if "strain" doesn"t match regex above
  strain_backup_fields: ["isolate", "accession"]
  # List of date fields to standardize to ISO format YYYY-MM-DD
  date_fields: ["date", "date_released", "date_updated"]
  # List of expected date formats that are present in the date fields provided above
  # These date formats should use directives expected by datetime
  # See https://docs.python.org/3.9/library/datetime.html#strftime-and-strptime-format-codes
  expected_date_formats: ["%Y", "%Y-%m", "%Y-%m-%d", "%Y-%m-%dT%H:%M:%SZ"]
  # The expected field that contains the GenBank geo_loc_name
  genbank_location_field: location
  titlecase:
    # List of string fields to titlecase
    fields: ["region", "country", "division", "location"]
    # List of abbreviations not cast to titlecase, keeps uppercase
    abbreviations: ["USA"]
    # Articles that should not be cast to titlecase
    articles: [
      "and", "d", "de", "del", "des", "di", "do", "en", "l", "la", "las", "le",
      "los", "nad", "of", "op", "sur", "the", "y"
    ]
  # Metadata field that contains the list of authors associated with the sequence
  authors_field: "full_authors"
  # Default value to use if the authors field is empty
  authors_default_value: "?"
  # Name to use for the generated abbreviated authors field
  abbr_authors_field: "authors"
  # Path to the manual annotations file
  # The path should be relative to the working directory (e.g. --directory).
  # If the path doesn't exist in the working directory, the file in the workflow's defaults/ directory it used instead (if it exists).
  annotations: "annotations.tsv"
  # The ID field in the metadata to use to merge the manual annotations
  annotations_id: "accession"
  # The ID field in the metadata to use as the sequence id in the output FASTA file
  output_id_field: "accession"
  # The field in the NDJSON record that contains the actual genomic sequence
  output_sequence_field: "sequence"
  # The field in the NDJSON record that contains the actual GenBank accession
  genbank_accession: 'accession'
  # The list of metadata columns to keep in the final output of the curation pipeline.
  metadata_columns: [
    "name",
    "accession",
    "accession_version",
    "strain",
    "isolate",
    "date",
    "year",
    "region",
    "country",
    "division",
    "location",
    "length",
    "host",
    "is_lab_host",
    "date_released",
    "date_updated",
    "authors",
    "full_authors",
    "institution",
    "url",
    "genotype",
    "taxon_id",
    "genotype_genbank",
    "subgenotype_genbank"
  ]
